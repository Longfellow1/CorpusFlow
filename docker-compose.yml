services:
  algorithm:
    build:
      context: ./algorithm
    environment:
      ARK_BASE_URL: "${ARK_BASE_URL:-https://ark.cn-beijing.volces.com/api/v3}"
      ARK_API_KEY: "${ARK_API_KEY:-}"
      ARK_MODEL: "${ARK_MODEL:-doubao-seed-1-6-250615}"
      ARK_TIMEOUT_SECONDS: "${ARK_TIMEOUT_SECONDS:-120}"
      GENERATE_CONCURRENCY: "${GENERATE_CONCURRENCY:-8}"
      MAX_GENERATE_CONCURRENCY: "${MAX_GENERATE_CONCURRENCY:-16}"
      QUICK_GENERATE_DEFAULT_CONCURRENCY: "${QUICK_GENERATE_DEFAULT_CONCURRENCY:-8}"
      QUICK_GENERATE_MAX_CONCURRENCY: "${QUICK_GENERATE_MAX_CONCURRENCY:-16}"
      EVALUATION_ASSET_CONCURRENCY: "${EVALUATION_ASSET_CONCURRENCY:-4}"
      EVALUATION_LLM_ENABLED: "${EVALUATION_LLM_ENABLED:-false}"
    ports:
      - "8001:8001"

  app:
    build:
      context: .
    depends_on:
      - algorithm
    environment:
      PORT: "3000"
      ALGORITHM_BASE_URL: "http://algorithm:8001"
      ARK_BASE_URL: "${ARK_BASE_URL:-https://ark.cn-beijing.volces.com/api/v3}"
      ARK_API_KEY: "${ARK_API_KEY:-}"
      ARK_MODEL: "${ARK_MODEL:-doubao-seed-1-6-250615}"
      EVALUATION_LLM_ENABLED: "${EVALUATION_LLM_ENABLED:-false}"
    ports:
      - "3000:3000"
